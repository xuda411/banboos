<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banboos 2.0 · 运营分析</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark"><span class="bamboo">竹</span><span>Banboos 2.0</span></div>
      <span id="apiState" class="status status-muted">正在连接 API…</span>
    </header>
    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">服务器化能源分析平台</p>
          <h1>运营分析工作台</h1>
          <p>第一阶段只读版本：节点、电价和气象数据统一从 API 读取。</p>
        </div>
        <div class="hero-badge">只读模式</div>
      </section>
      <section class="filters card">
        <label>省份<select id="province"><option value="">全部省份</option><option>湖北</option><option>广东</option></select></label>
        <label>节点<select id="node"></select></label>
        <label>市场<select id="market"><option>实时</option><option>日前</option></select></label>
        <label>开始日期<input id="startDate" type="date" value="2026-01-01" /></label>
        <label>结束日期<input id="endDate" type="date" value="2026-01-31" /></label>
        <button id="refresh" class="primary">刷新摘要</button>
      </section>
      <section class="card task-panel">
        <div class="section-heading">
          <div><p class="eyebrow">异步测算</p><h2>财务测算任务</h2></div>
          <span id="taskState" class="status status-muted">未提交</span>
        </div>
        <div class="task-form">
          <label>功率（MW）<input id="powerMw" type="number" min="0.01" step="0.01" value="100" /></label>
          <label>容量（MWh）<input id="capacityMwh" type="number" min="0.01" step="0.01" value="200" /></label>
          <label>首年收入（元）<input id="annualRevenue" type="number" min="0" step="1000" value="8000000" /></label>
          <button id="submitFinancial" class="primary">提交财务测算</button>
        </div>
        <div class="task-progress"><span id="taskMessage">填写参数后提交，Worker 将异步执行。</span><a id="downloadReport" hidden>下载 XLSX 报表</a></div>
      </section>
      <section class="metrics">
        <article class="metric card"><span>有效电价日</span><strong id="validDays">—</strong><small id="priceSource">等待查询</small></article>
        <article class="metric card"><span>96点数据量</span><strong id="dataPoints">—</strong><small id="priceRange">等待查询</small></article>
        <article class="metric card"><span>气象观测</span><strong id="weatherRows">—</strong><small id="weatherSource">等待查询</small></article>
        <article class="metric card"><span>电价完整率</span><strong id="coverage">—</strong><small id="qualityDetail">等待查询</small></article>
      </section>
      <section class="card notice" id="notice">正在读取只读 API…</section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
