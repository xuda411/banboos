services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: banboos2
      POSTGRES_USER: banboos
      POSTGRES_PASSWORD: banboos-dev-only
    ports: ["5432:5432"]
    volumes: ["banboos2-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4.1
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: banboos
      MINIO_ROOT_PASSWORD: banboos-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["banboos2-minio:/data"]

volumes:
  banboos2-postgres:
  banboos2-minio:
